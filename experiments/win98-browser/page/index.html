<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>slot</title>
<style>html, body { height: 100%; margin: 0; background: #000; } #dos { width: 100%; height: 100%; }</style>
<link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
<script src="https://v8.js-dos.com/latest/js-dos.js"></script>
</head>
<body>
<div id="dos"></div>
<script>
(function () {
// One js-dos (DOSBox-X wasm) instance per page. Query parameters:
//   slot=N                  window label
//   owner=dos.zone          sockdrive owner token (js-dos public images are under "dos.zone")
//   c=<drive> [d=<drive>]   sockdrive drive names to mount as C: (and D:)
//   server=1                start an IPX server (host)
//   connect=<peerId|alias>  join an IPX server
const q = new URLSearchParams(location.search);
const slot = q.get("slot") ?? "0";
document.title = `slot ${slot}`;
const owner = q.get("owner") ?? "dos.zone";
const c = q.get("c");
const d = q.get("d");
// Same-origin proxy to the js-dos image CDN (see serve.mjs); override with ?sock=wss://sockdrive.js-dos.com:8001
const sock = q.get("sock") ?? (location.origin + "/sd");

// The official backend takes "<backend> <owner> <drive>" and composes the URL itself; any other backend
// URL is used verbatim, so for the local proxy we pass the full drive URL.
const official = sock.startsWith("wss://sockdrive.js-dos.com");
const mount = (n, drive) => official ? `imgmount ${n} sockdrive ${sock} ${owner} ${drive}` : `imgmount ${n} sockdrive ${sock}/${owner}/${drive}`;

// Windows 9x profile, adapted from the js-dos sockdrive guide (Diablo / Windows 95 example).
const conf = `
[sdl]
autolock=false
mouse_emulation=integration
[dosbox]
title=Windows 9x
memsize=128
[video]
vmemsize=8
vesa modelist width limit=0
vesa modelist height limit=0
[dos]
ver=7.1
hard drive data rate limit=0
floppy drive data rate limit=0
[cpu]
cputype=pentium_mmx
core=auto
integration device=true
[sblaster]
sbtype=sb16vibra
[fdc, primary]
int13fakev86io=true
[ide, primary]
int13fakeio=true
int13fakev86io=true
[ide, secondary]
int13fakeio=true
int13fakev86io=true
cd-rom insertion delay=4000
[render]
scaler=none
[autoexec]
echo off
${c ? mount(2, c) : ""}
${d ? mount(3, d) : ""}
${c ? "boot c:" : ""}
`;

window.state = { slot, ready: false, peerId: null, frames: 0, startedAt: Date.now(), readyAt: null, exitedAt: null, stdout: [] };
window.ci = null;

const props = Dos(document.getElementById("dos"), {
    dosboxConf: conf,
    // Explicit prefix: without it js-dos resolves webrtcnet.mjs/.wasm relative to this page (404) and IPX setup hangs.
    pathPrefix: "https://v8.js-dos.com/latest/emulators/",
    backend: "dosboxX",
    backendLocked: true,
    workerThread: true,
    autoStart: true,
    kiosk: true,
    mouseCapture: false,
    startIpxServer: q.get("server") === "1",
    connectIpxAddress: q.get("connect") ?? undefined,
    onEvent: (event, ci) => {
        console.log("js-dos event", event);
        if (event === "ci-ready") {
            window.ci = ci;
            window.state.ready = true;
            window.state.readyAt = Date.now();
            try { const net = ci.net(); window.state.peerId = net ? String(net.peerId) : null; } catch (e) { window.state.netError = String(e); }
            try { ci.events().onFrame(() => { window.state.frames++; }); } catch (e) { window.state.frameHookError = String(e); }
            try { ci.events().onStdout((m) => { const st = window.state.stdout; st.push(String(m)); if (st.length > 400) st.shift(); }); } catch (e) { window.state.stdoutHookError = String(e); }
            try { ci.events().onExit(() => { window.state.exitedAt = Date.now(); }); } catch (e) { window.state.exitHookError = String(e); }
        }
    },
});
try { props.setNoCloud(true); } catch {}

// Heuristic "has Windows 98 reached the desktop": fraction of pixels close to the classic teal (0,128,128).
window.desktopScore = async () => {
    const img = await window.ci.screenshot();
    const d = img.data; let teal = 0; const n = d.length / 4;
    for (let i = 0; i < d.length; i += 4) { if (d[i] < 40 && Math.abs(d[i + 1] - 128) < 40 && Math.abs(d[i + 2] - 128) < 40) teal++; }
    return teal / n;
};

// Screenshot straight from the emulator (independent of page rendering/throttling).
window.screenshotPNG = async () => {
    const img = await window.ci.screenshot();
    const canvas = document.createElement("canvas");
    canvas.width = img.width; canvas.height = img.height;
    canvas.getContext("2d").putImageData(img, 0, 0);
    return canvas.toDataURL("image/png");
};
})();
</script>
</body>
</html>
